# Built with `zensical build -f mkdocs.yml` (see docs/gen_ref_pages.py's module
# docstring for why Zensical rather than mkdocs + mkdocs-material). Zensical reads this
# file natively as its documented mkdocs-compatible config path -- no rewrite to its
# native zensical.toml format needed for what this site currently uses.
site_name: OpenDota SDK
site_description: Async Python SDK for the OpenDota API
repo_url: https://github.com/jbnone/opendota-sdk
repo_name: jbnone/opendota-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit

plugins:
  - search
  # No gen-files plugin entry: Zensical doesn't support it, so the API reference pages
  # are generated by a plain pre-build step instead -- see docs/gen_ref_pages.py.
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            signature_crossrefs: true
            show_if_no_docstring: false

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Items: guides/items.md
      - Heroes: guides/heroes.md
      - Hero Statistics: guides/hero-stats.md
      - Configuration: guides/configuration.md
      - Errors: guides/errors.md
  - API Reference: api/
