# The product-groomer agent — see AGENTS.md §15 for the roles, labels, and gates.
#
#   propose-issues   weekly, and on demand by the owner. Opens `proposal`
#                    issues, which start nothing until the owner labels them
#                    `approved`.
#   refine-proposal  the owner comments `@claude` on one of its open proposals,
#                    before the issue is approved.
#
# Neither job executes repository code: no uv, no `uv run`, no git tools, and
# `contents: read`. The action refuses to run for actors without write access.
# Keep it that way: no `allowed_non_write_users`, no `allowed_bots: '*'`.

name: agent-product-groomer

on:
  issue_comment:
    types: [created]
  # Weekly proposals, Saturday 07:00 UTC, after Renovate's Saturday run.
  # GitHub disables schedules on a public repo after 60 days without a
  # commit; a push re-enables them.
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose-issues:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'jbnone')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Strips credentials, including the subscription token, from every
      # subprocess Claude starts; see agent-python-developer.yml.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    concurrency:
      group: agent-product-groomer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write  # opens `proposal` issues; it cannot touch code or PRs
      id-token: write  # exchanged for a short-lived Claude app token; without it the action cannot authenticate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # No uv and no `uv run` here: the groomer reads, fetches, and opens issues,
      # and never executes repository code. Bubblewrap is for the subprocess
      # scrub; see agent-python-developer.yml.
      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the product-groomer agent
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the product-groomer role for this repository. Read
            `.claude/agents/product-groomer.md` and follow it exactly.
          # Write is for the issue body file only; with `contents: read` and no
          # git tools, nothing written can leave the runner except as an issue.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh pr list:*),Bash(curl -sS https://api.opendota.com/api),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*)"

  refine-proposal:
    # The owner's @claude comment on an open proposal that is not approved yet.
    # Once `approved` is on the issue, steering moves to the developer's PR.
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.sender.login == 'jbnone' &&
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.issue.labels.*.name, 'proposal') &&
      !contains(github.event.issue.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # same reason as `propose-issues`
    # Shares the groomer's queue, so a refine never races a grooming run.
    concurrency:
      group: agent-product-groomer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write  # edits this one issue's title and body and replies to it
      id-token: write  # same OIDC-to-app-token exchange as `propose-issues`

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # No uv and no `uv run`, as in `propose-issues`: refining never executes repository code.
      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the product-groomer agent on its own proposal
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only the issue number and comment id reach the prompt, never the
          # comment text: the agent reads that itself and checks its author.
          prompt: |
            You are the product-groomer role for this repository. Read
            `.claude/agents/product-groomer.md` and follow its section "Refining
            a proposal" for issue #${{ github.event.issue.number }}. The owner's
            comment to act on has id ${{ github.event.comment.id }}.
          # Every gh rule names this issue, so no other issue can be read or
          # changed. The edit rules allow only the body and the title; a label
          # added anyway would come from claude[bot], and `implement-issue`
          # ignores labels from anyone but the owner.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view ${{ github.event.issue.number }}:*),Bash(gh api repos/jbnone/opendota-sdk/issues/comments/${{ github.event.comment.id }}:*),Bash(gh issue edit ${{ github.event.issue.number }} --body-file:*),Bash(gh issue edit ${{ github.event.issue.number }} --title:*),Bash(gh issue comment ${{ github.event.issue.number }} --body-file:*),Bash(curl -sS https://api.opendota.com/api),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*)"
