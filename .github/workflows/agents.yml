# Agentic workflow — see AGENTS.md §15 for the roles, labels, and gates.
#
# Two gates stand between an idea and shipped code, and both belong to the
# repository owner:
#   1. `implement` fires only when the owner adds `approved`/`design-approved`
#      to an issue. That label is the one and only approval to start building.
#      `revise` sends the developer back to its own PR when the owner comments
#      `@claude` there; a guard step refuses anything but this repo's
#      `claude/` branches before Claude starts.
#   2. The `protect-main` ruleset requires a pull request, green CI, and an owner
#      review before anything merges, with no bypass for the Claude app.
#
# The action also refuses to run for actors without write access, so issues,
# comments, and labels from anyone else never start a run. Keep it that way:
# no `allowed_non_write_users`, no `allowed_bots: '*'`, no `pull_request_target`.
# Fork pull requests never receive secrets, and `review` additionally checks
# that the head lives in this repository.

name: agents

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  implement:
    if: >-
      github.event_name == 'issues' &&
      github.event.sender.login == 'jbnone' &&
      (github.event.label.name == 'approved' || github.event.label.name == 'design-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Strips credentials, including the subscription token, from every
      # subprocess Claude starts; GitHub tokens are kept so `gh` still works.
      # `uv run` already lets the agent execute code with network access, so
      # this scrub, not the tool allowlist, is what protects the token.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    # One implementation at a time: a burst of labels queues instead of fanning out.
    concurrency:
      group: agents-implement
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read  # lets Claude read CI results on the PR it opens
      id-token: write  # exchanged for a short-lived Claude app token; without it the action cannot authenticate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs bubblewrap, and Claude Code refuses
      # to start without it. The action installs it only when
      # `allowed_non_write_users` is set, which this workflow never sets, so this
      # step mirrors the action's own "Install subprocess isolation dependencies".
      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the developer agent
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          # Subscription auth: a long-lived token from `claude setup-token`, so
          # runs draw on the owner's Claude plan. An API key bills the Console
          # organization's prepaid credit instead, which is a separate account.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode on the labeled issue: a tracking comment, the full issue
          # context, and a `claude/` branch for the work.
          track_progress: true
          # Only the owner's comments reach the model; the issue body is
          # already vetted by the owner's label.
          include_comments_by_actor: jbnone
          additional_permissions: |
            actions: read
          prompt: |
            You are the developer role for this repository. Read
            `.claude/agents/developer.md` and follow it exactly for this issue.
            Open the pull request yourself with `gh pr create` when the work is
            done; do not stop at a link to a pre-filled PR page.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(uv run:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*)"

  revise:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.sender.login == 'jbnone' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # same reason as `implement`
    # Shares the implement queue: one developer run at a time, whatever started it.
    concurrency:
      group: agents-implement
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write  # same OIDC-to-app-token exchange as `implement`

    steps:
      # The action checks out the PR head itself, forks included. Only the
      # developer's own branches in this repository may be revised, so stop
      # here, before any PR code is fetched, if this is anything else.
      - name: Refuse anything but the developer's own branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          read -r head_repo head_ref state < <(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"\(.head.repo.full_name) \(.head.ref) \(.state)"')
          echo "PR #$PR_NUMBER: $head_repo:$head_ref ($state)"
          if [ "$head_repo" != "$REPO" ] || [[ "$head_ref" != claude/* ]] || [ "$state" != "open" ]; then
            echo "::error::Only open PRs on this repository's claude/ branches can be revised."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the developer agent on its own PR
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt`: tag mode answers the owner's @claude comment, checks
          # out the PR branch, and commits to it.
          include_comments_by_actor: jbnone
          additional_permissions: |
            actions: read
          # `gh pr view` and the PR review-comments endpoint let the developer read
          # the reviewer's findings. On a public repo they also return comments from
          # anyone; the role file treats those as information, never instructions.
          # Two rules for the endpoint: with a `*` for the PR number, a trailing
          # ` *` no longer also matches the bare command.
          claude_args: |
            --max-turns 60
            --append-system-prompt "You are the developer role for this repository. Read .claude/agents/developer.md and follow its section 'Revising your own pull request'. Commit to this PR's branch; do not open a new pull request."
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(uv run:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh api repos/jbnone/opendota-sdk/pulls/*/comments),Bash(gh api repos/jbnone/opendota-sdk/pulls/*/comments *),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*)"

  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"  # same reason as `implement`
    # A new push to the same PR supersedes the review in flight.
    concurrency:
      group: agents-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write  # same OIDC-to-app-token exchange as `implement`

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs bubblewrap, and Claude Code refuses
      # to start without it. The action installs it only when
      # `allowed_non_write_users` is set, which this workflow never sets, so this
      # step mirrors the action's own "Install subprocess isolation dependencies".
      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the reviewer agent
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          include_comments_by_actor: jbnone
          # PRs opened by the developer agent arrive with the Claude app as the
          # actor. These two logins are the only bots that may trigger a run.
          allowed_bots: "claude[bot],claude-code[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            You are the reviewer role for this repository. Read
            `.claude/agents/reviewer.md` and follow it exactly for this pull
            request.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(uv run:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*),mcp__github_inline_comment__create_inline_comment"
