name: ci

on:
  push:
    branches: [ main ]
    # Every tag, not just v*: a mistyped release tag must fail loudly in "Stamp version"
    # instead of silently triggering nothing.
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: false  # a poisoned cache must not reach published artifacts

    - name: Install dependencies
      run: uv sync --locked --all-groups

    - name: Lint
      run: uv run ruff check

    - name: Check formatting
      run: uv run ruff format --check

    - name: Type check
      run: uv run ty check

    - name: Lint workflows
      run: uv run zizmor .github/workflows

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        # Sets UV_PYTHON, which takes precedence over .python-version. A Python
        # installed by actions/setup-python does not, so uv would test 3.14 every time.
        python-version: ${{ matrix.python-version }}
        enable-cache: false

    - name: Install dependencies
      run: uv sync --locked --all-groups

    - name: Run tests
      run: uv run pytest --cov=opendota_sdk

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # git describe needs the tags
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false  # a poisoned cache must not reach published artifacts

      # The tag is the version; pyproject.toml only holds a 0.0.0 placeholder.
      # Pushes to main get a unique dev version above the last release, so every
      # merge exercises the TestPyPI publishing path end to end.
      - name: Stamp version
        if: github.event_name == 'push'
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != v* ]]; then
              echo "::error::Release tags must start with 'v' (got '$GITHUB_REF_NAME')"
              exit 1
            fi
            uv version --frozen "${GITHUB_REF_NAME#v}"
          else
            last=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.0.0)
            uv version --frozen "${last#v}.post0.dev${GITHUB_RUN_NUMBER}"
          fi

      - name: Build
        run: uv build --no-sources

      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import opendota_sdk; print(opendota_sdk.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package-distributions
          path: dist/

  testpypi-publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/p/opendota-sdk

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run keeps its run number, so its dev version is already uploaded.
          skip-existing: true

  pypi-publish:
    if: github.ref_type == 'tag'
    # Parallel to TestPyPI, not after it: a TestPyPI outage must not block a release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/opendota-sdk

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  github-release:
    if: github.ref_type == 'tag'
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # git-cliff needs the history since the previous tag
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false  # a poisoned cache must not reach published artifacts

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --only-group release git-cliff --latest --strip all > notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|alpha|beta)\.?[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
