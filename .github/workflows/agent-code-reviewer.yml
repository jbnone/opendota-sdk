# The code-reviewer agent — see AGENTS.md §15 for the roles, labels, and gates.
#
#   review-pull-request     every PR whose head is in this repository, except
#                           Renovate's. Reports findings; edits nothing.
#   decide-next-round       on `claude/` PRs only: waits for this commit's CI run,
#                           and sends the python-developer back when the review
#                           has blocking findings or CI failed, at most
#                           MAX_ROUNDS times per PR. After that it says so on
#                           the PR and the owner takes over.
#   send-back-to-developer  runs agent-python-developer.yml's fix job.
#
# The loop closes on its own: the developer's push is a new `synchronize`
# event, which reviews the new commit. Nothing merges without the owner.
#
# The action refuses to run for actors without write access. Keep it that way:
# no `allowed_non_write_users`, no `allowed_bots: '*'`, no `pull_request_target`.
# Fork pull requests never receive secrets, and the review job additionally
# checks that the head lives in this repository.

name: agent-code-reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review-pull-request:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Strips credentials, including the subscription token, from every
      # subprocess Claude starts; see agent-python-developer.yml.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    # A new push to the same PR supersedes the review in flight.
    concurrency:
      group: agent-code-reviewer-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write  # exchanged for a short-lived Claude app token; without it the action cannot authenticate
    outputs:
      verdict: ${{ steps.reviewer.outputs.structured_output }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs bubblewrap, and Claude Code refuses
      # to start without it. The action installs it only when
      # `allowed_non_write_users` is set, which this workflow never sets, so this
      # step mirrors the action's own "Install subprocess isolation dependencies".
      - name: Install subprocess isolation dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."
            sleep 5
          done
          command -v bwrap
          # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the code-reviewer agent
        id: reviewer
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          include_comments_by_actor: jbnone
          # PRs opened by the developer agent arrive with the Claude app as the
          # actor. These two logins are the only bots that may trigger a run.
          allowed_bots: "claude[bot],claude-code[bot]"
          additional_permissions: |
            actions: read
          prompt: |
            You are the code-reviewer role for this repository. Read
            `.claude/agents/code-reviewer.md` and follow it exactly for this
            pull request.
          # The JSON schema is the verdict `decide-next-round` reads: the
          # `structured_output` step output, not the comment text.
          # Tag mode runs with `acceptEdits` and adds git add/commit/push tools
          # to every run; the deny list takes them back, so the reviewer
          # really edits nothing.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(uv run:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(curl -sS https://api.opendota.com/api/*),Bash(curl -sS https://raw.githubusercontent.com/odota/*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --json-schema '{"type":"object","properties":{"blocking_findings":{"type":"integer","minimum":0},"nits":{"type":"integer","minimum":0}},"required":["blocking_findings","nits"],"additionalProperties":false}'

  decide-next-round:
    needs: review-pull-request
    # Only the developer's own branches loop; everyone else's PRs stop at the review.
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 40  # most of it waiting for CI
    concurrency:
      group: agent-code-reviewer-decide-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: read  # finds this commit's CI run and waits for it
      pull-requests: write  # posts the round and stop comments
    outputs:
      fix: ${{ steps.decide.outputs.fix }}
      round: ${{ steps.decide.outputs.round }}
      max_rounds: ${{ steps.decide.outputs.max_rounds }}
      blocking: ${{ steps.decide.outputs.blocking }}
      ci: ${{ steps.decide.outputs.ci }}

    steps:
      - name: Decide whether the python-developer goes another round
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ needs.review-pull-request.outputs.verdict }}
          # Each round is a full developer run plus a full review, so this caps
          # the spend one PR can draw without the owner.
          MAX_ROUNDS: "3"
        run: |
          set -euo pipefail
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          stop() { note "$1"; echo "fix=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # Counts this workflow's own marker comments; comments are paginated.
          count_marker() {
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$1\"))) | .id" | wc -l | tr -d ' '
          }

          # The same guard as the developer's jobs, plus: still the reviewed commit.
          read -r head_repo head_ref head_sha state < <(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"\(.head.repo.full_name) \(.head.ref) \(.head.sha) \(.state)"')
          if [ "$head_repo" != "$REPO" ] || [[ "$head_ref" != claude/* ]] || [ "$state" != open ]; then
            stop "Not an open claude/ PR in this repository; nothing to do."
          fi
          [ "$head_sha" = "$REVIEWED_SHA" ] || stop "A newer commit superseded this review; its own run decides."

          blocking=$(jq -r '.blocking_findings // empty' <<<"$VERDICT" 2>/dev/null || true)
          [[ "$blocking" =~ ^[0-9]+$ ]] || stop "The code-reviewer returned no verdict; leaving this one to the owner."

          # CI runs in its own workflow, so look its run up by commit and wait for it.
          run_id=""
          for _ in $(seq 30); do
            run_id=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$head_sha" --event pull_request \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 20
          done
          [ -n "$run_id" ] || stop "No CI run found for $head_sha after 10 minutes; leaving this one to the owner."
          gh run watch "$run_id" --repo "$REPO" --interval 30 > /dev/null || true
          conclusion=$(gh run view "$run_id" --repo "$REPO" --json conclusion --jq .conclusion)
          case "$conclusion" in
            success) ci=passed ;;
            failure) ci=failed ;;
            *) stop "CI for $head_sha ended as '$conclusion'; nothing to fix automatically." ;;
          esac

          if [ "$blocking" -eq 0 ] && [ "$ci" = passed ]; then
            stop "No blocking findings and CI passed: ready for the owner's review."
          fi

          rounds=$(count_marker '<!-- agent-fix-round -->')
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            if [ "$(count_marker '<!-- agent-fix-stopped -->')" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "<!-- agent-fix-stopped -->
          Stopped after $MAX_ROUNDS automatic rounds: the code-reviewer still reports $blocking blocking finding(s) and CI $ci. Over to you: comment \`@claude\` with instructions, or take the branch over."
            fi
            stop "Round limit ($MAX_ROUNDS) reached; the owner takes over."
          fi

          round=$((rounds + 1))
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "<!-- agent-fix-round -->
          Automatic round $round of $MAX_ROUNDS: the code-reviewer reported $blocking blocking finding(s) and CI $ci, so the python-developer is going back to fix them."
          note "Round $round of $MAX_ROUNDS: $blocking blocking finding(s), CI $ci."
          {
            echo "fix=true"
            echo "round=$round"
            echo "max_rounds=$MAX_ROUNDS"
            echo "blocking=$blocking"
            echo "ci=$ci"
          } >> "$GITHUB_OUTPUT"

  send-back-to-developer:
    needs: decide-next-round
    if: needs.decide-next-round.outputs.fix == 'true'
    # A called workflow's jobs get at most what the calling job grants.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    # `./` rather than zizmor's suggested `$/`: GitHub's docs only document
    # `./` for reusable workflows, and a calling job has no earlier steps that
    # could plant a file at that path.
    uses: ./.github/workflows/agent-python-developer.yml  # zizmor: ignore[self-repository]
    with:
      round: ${{ needs.decide-next-round.outputs.round }}
      max_rounds: ${{ needs.decide-next-round.outputs.max_rounds }}
      blocking_findings: ${{ needs.decide-next-round.outputs.blocking }}
      ci_result: ${{ needs.decide-next-round.outputs.ci }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
