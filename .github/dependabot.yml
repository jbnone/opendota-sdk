version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"

    schedule:
      interval: "monthly"

    cooldown:
      default-days: 1

    commit-message:
      prefix: "deps"
      include: "scope"

    labels:
      - "dependencies"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "monthly"

    commit-message:
      prefix: "ci"

    labels:
      - "dependencies"
      - "automated"
