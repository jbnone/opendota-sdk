[project]
name = "opendota-sdk"
version = "0.1.0-alpha.5"
description = "SDK for the OpenDota API, providing enhanced capabilities for Dota 2 data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Juan Manuel Bermudez Cabrera", email = "juanmorestep@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
  "niquests>=3.9,<4.0",
  "tenacity>=9.0,<10.0",
]

[project.urls]
Homepage = "https://github.com/jbnone/opendota-sdk"
Documentation = "https://jbnone.github.io/opendota-sdk/"
Issues = "https://github.com/jbnone/opendota-sdk/issues"
Repository = "https://github.com/jbnone/opendota-sdk"


[build-system]
requires = ["uv_build>=0.11.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "ty==0.0.80",
]
docs = [
    # Zensical, not mkdocs + mkdocs-material: MkDocs 1.x is effectively unmaintained
    # (see docs/gen_ref_pages.py's module docstring for the full story) and Material for
    # MkDocs' own team has moved on to Zensical as its Material-compatible successor.
    # It natively reads mkdocs.yml (see the file itself), so no config rewrite needed.
    "zensical==0.0.62",
    # The handler Zensical's built-in mkdocstrings support renders through. Only the
    # bare handler package is needed -- not the `mkdocstrings` mkdocs-plugin package,
    # which Zensical replaces internally, and not `mkdocs-gen-files` /
    # `mkdocs-literate-nav`, which Zensical either reimplements natively (literate-nav)
    # or doesn't support as a plugin at all (gen-files; see docs/gen_ref_pages.py, run
    # as a plain pre-build step instead). Deliberately minimal: both of those two
    # packages' latest releases pull in a dependency ("properdocs") that isn't wanted
    # here, so the clean fix is not depending on either package at all.
    "mkdocstrings-python==2.0.8",
]

[tool.coverage.run]
source = ["src/opendota_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
